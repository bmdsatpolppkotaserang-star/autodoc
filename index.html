<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body { font-family: Arial; padding: 20px; max-width: 600px; margin: auto; }
      input, select { width: 100%; padding: 8px; margin-bottom: 5px; box-sizing: border-box; }
      button { background: #007bff; color: white; border: none; padding: 10px 20px; cursor: pointer; width: 100%; font-size: 16px; margin-top: 10px; }
      label { font-size: 12px; color: #666; font-weight: bold; }
      .autocomplete-container { position: relative; margin-bottom: 10px; }
      .suggestions-list {
        position: absolute; border: 1px solid #d4d4d4; border-bottom: none; border-top: none;
        z-index: 99; top: 100%; left: 0; right: 0; max-height: 150px; overflow-y: auto; background-color: #fff;
      }
      .suggestions-list div { padding: 10px; cursor: pointer; border-bottom: 1px solid #d4d4d4; font-size: 14px; }
      .suggestions-list div:hover { background-color: #e9e9e9; }
      .loading-box { font-style: italic; color: #007bff; margin-bottom: 15px; font-weight: bold; }
    </style>
  </head>
  <body>
    <h3>Form Otomasi BAST Satpol PP</h3>
    <div id="loadingStatus" class="loading-box">⏳ Sedang memuat database, mohon tunggu sebentar...</div>

    <form id="bastForm" onsubmit="handleFormSubmit(event)" style="display:none;">
      
      <!-- PILIH SURAT -->
      <label>Pilih Klasifikasi Surat:</label>
      <div class="autocomplete-container">
        <input type="text" id="cari_surat" placeholder="Ketik untuk mencari klasifikasi surat..." oninput="filterSurat(this.value)">
        <div id="list_surat" class="suggestions-list"></div>
      </div>
      <input type="text" name="nomor_surat" id="nomor_surat" placeholder="Nomor Surat" required>
      <input type="text" name="hari_tanggal" id="hari_tanggal" placeholder="Hari & Tanggal" required>
      <hr>

      <!-- PIHAK PERTAMA -->
      <label>Cari Pihak Pertama:</label>
      <div class="autocomplete-container">
        <input type="text" id="cari_p1" placeholder="Ketik nama pegawai..." oninput="filterPegawai(this.value, 'p1')">
        <div id="list_p1" class="suggestions-list"></div>
      </div>
      <input type="text" id="nama_p1" name="nama_p1" placeholder="Nama Pihak Pertama">
      <input type="text" id="nip_p1" name="nip_p1" placeholder="NIP Pihak Pertama">
      <input type="text" id="pangkat_p1" name="pangkat_p1" placeholder="Pangkat Pihak Pertama">
      <input type="text" id="jabatan_p1" name="jabatan_p1" placeholder="Jabatan Pihak Pertama">
      <hr>

      <!-- PIHAK KEDUA -->
      <label>Cari Pihak Kedua:</label>
      <div class="autocomplete-container">
        <input type="text" id="cari_p2" placeholder="Ketik nama pegawai..." oninput="filterPegawai(this.value, 'p2')">
        <div id="list_p2" class="suggestions-list"></div>
      </div>
      <input type="text" id="nama_p2" name="nama_p2" placeholder="Nama Pihak Kedua">
      <input type="text" id="nip_p2" name="nip_p2" placeholder="NIP Pihak Kedua">
      <input type="text" id="pangkat_p2" name="pangkat_p2" placeholder="Pangkat Pihak Kedua">
      <input type="text" id="jabatan_p2" name="jabatan_p2" placeholder="Jabatan Pihak Kedua">
      <hr>

      <!-- DETAIL BARANG -->
      <label>Cari Barang / Aset:</label>
      <div class="autocomplete-container">
        <input type="text" id="cari_aset" placeholder="Ketik nama barang/merk..." oninput="filterAset(this.value)">
        <div id="list_aset" class="suggestions-list"></div>
      </div>
      <input type="text" id="nama_barang" name="nama_barang" placeholder="Nama Barang">
      <input type="text" id="merk_type" name="merk_type" placeholder="Merk/Type">
      <input type="text" name="no_seri" placeholder="No. Sertifikat/Mesin/Polisi">
      <input type="text" id="tahun_perolehan" name="tahun_perolehan" placeholder="Tahun Perolehan">
      <input type="text" name="jumlah" placeholder="Jumlah">
      <input type="text" name="keterangan" placeholder="Keterangan">
      <hr>

      <!-- TTD PIHAK 1 -->
      <label>Cari TTD Pihak 1:</label>
      <div class="autocomplete-container">
        <input type="text" id="cari_ttd_p1" placeholder="Ketik nama penandatangan..." oninput="filterPegawai(this.value, 'ttd_p1')">
        <div id="list_ttd_p1" class="suggestions-list"></div>
      </div>
      <input type="text" name="nama_p1_ttd" id="nama_p1_ttd" placeholder="Nama TTD Pihak 1">
      <input type="text" name="pangkat_p1_ttd" id="pangkat_p1_ttd" placeholder="Pangkat TTD Pihak 1">
      <input type="text" name="nip_p1_ttd" id="nip_p1_ttd" placeholder="NIP TTD Pihak 1">
      <hr>

      <!-- TTD PIHAK 2 -->
      <label>Cari TTD Pihak 2:</label>
      <div class="autocomplete-container">
        <input type="text" id="cari_ttd_p2" placeholder="Ketik nama penandatangan..." oninput="filterPegawai(this.value, 'ttd_p2')">
        <div id="list_ttd_p2" class="suggestions-list"></div>
      </div>
      <input type="text" name="nama_p2_ttd" id="nama_p2_ttd" placeholder="Nama TTD Pihak 2">
      <input type="text" name="pangkat_p2_ttd" id="pangkat_p2_ttd" placeholder="Pangkat TTD Pihak 2">
      <input type="text" name="nip_p2_ttd" id="nip_p2_ttd" placeholder="NIP TTD Pihak 2">
      <hr>

      <!-- MENGETAHUI -->
      <label>Cari Yang Mengetahui:</label>
      <div class="autocomplete-container">
        <input type="text" id="cari_mengetahui" placeholder="Ketik nama penandatangan..." oninput="filterPegawai(this.value, 'mengetahui')">
        <div id="list_mengetahui" class="suggestions-list"></div>
      </div>
      <input type="text" name="nama_mengetahui" id="nama_mengetahui" placeholder="Nama Mengetahui">
      <input type="text" name="pangkat_mengetahui" id="pangkat_mengetahui" placeholder="Pangkat Mengetahui">
      <input type="text" name="nip_mengetahui" id="nip_mengetahui" placeholder="NIP Mengetahui">
      <hr>
      
      <button type="submit">Buat BAST</button>
    </form>

    <script>
      const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzf3jtNIVf_IchM1NdKQqoceLqrk3pl-gS4B2QzQXerIxJ9OLYLZ2l3Js5tkIO0kf-g/exec';

      window.onload = function() {
        fetch(WEB_APP_URL + '?action=getData')
          .then(res => res.json())
          .then(res => {
            if(res.status === 'success') {
              window.dataPegawai = res.pegawai;
              window.dataAset = res.aset;
              window.dataSurat = res.surat;

              // Sembunyikan pesan loading dan tampilkan form
              document.getElementById('loadingStatus').style.display = 'none';
              document.getElementById('bastForm').style.display = 'block';
            }
          })
          .catch(err => {
            document.getElementById('loadingStatus').innerText = 'Gagal memuat database: ' + err;
          });
      };

      // Tutup dropdown jika klik di luar
      document.addEventListener('click', function (e) {
        if (!e.target.closest('.autocomplete-container')) {
          document.querySelectorAll('.suggestions-list').forEach(el => el.innerHTML = '');
        }
      });

      function filterSurat(val) {
        let list = document.getElementById('list_surat');
        list.innerHTML = '';
        if (!val) return;
        let matches = window.dataSurat.filter(s => s[0].toLowerCase().includes(val.toLowerCase()));
        matches.forEach(s => {
          let div = document.createElement('div');
          div.innerHTML = s[0];
          div.onclick = function() {
            document.getElementById('cari_surat').value = s[0];
            document.getElementById('nomor_surat').value = s[1] || '';
            document.getElementById('hari_tanggal').value = s[2] || '';
            list.innerHTML = '';
          };
          list.appendChild(div);
        });
      }

      function filterPegawai(val, target) {
        let list = document.getElementById('list_' + target);
        list.innerHTML = '';
        if (!val) return;
        let matches = window.dataPegawai.filter(p => p[0].toLowerCase().includes(val.toLowerCase()) || p[1].toLowerCase().includes(val.toLowerCase()));
        matches.forEach(p => {
          let div = document.createElement('div');
          div.innerHTML = `<b>${p[0]}</b> (${p[1]})`;
          div.onclick = function() {
            document.getElementById('cari_' + target).value = p[0];
            if(target === 'p1') {
              document.getElementById('nama_p1').value = p[0] || '';
              document.getElementById('nip_p1').value = p[1] || '';
              document.getElementById('pangkat_p1').value = p[2] || '';
              document.getElementById('jabatan_p1').value = p[3] || '';
            } else if(target === 'p2') {
              document.getElementById('nama_p2').value = p[0] || '';
              document.getElementById('nip_p2').value = p[1] || '';
              document.getElementById('pangkat_p2').value = p[2] || '';
              document.getElementById('jabatan_p2').value = p[3] || '';
            } else if(target === 'ttd_p1') {
              document.getElementById('nama_p1_ttd').value = p[0] || '';
              document.getElementById('pangkat_p1_ttd').value = p[2] || '';
              document.getElementById('nip_p1_ttd').value = p[1] || '';
            } else if(target === 'ttd_p2') {
              document.getElementById('nama_p2_ttd').value = p[0] || '';
              document.getElementById('pangkat_p2_ttd').value = p[2] || '';
              document.getElementById('nip_p2_ttd').value = p[1] || '';
            } else if(target === 'mengetahui') {
              document.getElementById('nama_mengetahui').value = p[0] || '';
              document.getElementById('pangkat_mengetahui').value = p[2] || '';
              document.getElementById('nip_mengetahui').value = p[1] || '';
            }
            list.innerHTML = '';
          };
          list.appendChild(div);
        });
      }

      function filterAset(val) {
        let list = document.getElementById('list_aset');
        list.innerHTML = '';
        if (!val) return;
        let matches = window.dataAset.filter(a => a[0].toLowerCase().includes(val.toLowerCase()) || a[1].toLowerCase().includes(val.toLowerCase()));
        matches.forEach(a => {
          let div = document.createElement('div');
          div.innerHTML = `<b>${a[0]}</b> - ${a[1]}`;
          div.onclick = function() {
            document.getElementById('cari_aset').value = a[0];
            document.getElementById('nama_barang').value = a[0] || '';
            document.getElementById('merk_type').value = a[1] || '';
            document.getElementById('tahun_perolehan').value = a[2] || '';
            list.innerHTML = '';
          };
          list.appendChild(div);
        });
      }

      async function handleFormSubmit(event) {
        event.preventDefault();
        alert('Sedang memproses, mohon tunggu...');
        
        const form = document.getElementById('bastForm');
        const formData = new FormData(form);
        const data = Object.fromEntries(formData.entries());

        try {
          const response = await fetch(WEB_APP_URL, {
            method: 'POST',
            body: JSON.stringify(data)
          });
          
          const result = await response.json();
          if(result.status === 'success') {
            alert('Berhasil! Link dokumen: ' + result.url);
            window.open(result.url, '_blank');
          } else {
            alert('Gagal: ' + result.message);
          }
        } catch (error) {
          alert('Terjadi kesalahan koneksi: ' + error);
        }
      }
    </script>
  </body>
</html>
