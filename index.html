<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
      :root {
        --primary: #4f46e5;
        --primary-hover: #4338ca;
        --bg-color: #f3f4f6;
        --card-bg: #ffffff;
        --text-color: #1f2937;
        --border-color: #d1d5db;
      }

      body { 
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        background-color: var(--bg-color); 
        color: var(--text-color); 
        margin: 0; 
        padding: 20px; 
      }

      .container { 
        max-width: 750px; 
        margin: 30px auto; 
        background: var(--card-bg); 
        padding: 30px; 
        border-radius: 12px; 
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); 
      }

      h3 { 
        margin-top: 0; 
        color: #111827; 
        font-size: 22px; 
        border-bottom: 2px solid #e5e7eb; 
        padding-bottom: 12px; 
        margin-bottom: 20px; 
      }

      h4 { 
        color: #374151; 
        font-size: 16px; 
        margin-top: 25px; 
        margin-bottom: 10px; 
        border-left: 4px solid var(--primary);
        padding-left: 8px;
      }

      label { 
        font-size: 13px; 
        color: #4b5563; 
        font-weight: 600; 
        display: block; 
        margin-top: 12px; 
        margin-bottom: 4px; 
      }

      input, select { 
        width: 100%; 
        padding: 10px 12px; 
        margin-bottom: 8px; 
        border: 1px solid var(--border-color); 
        border-radius: 6px; 
        font-size: 14px; 
        box-sizing: border-box; 
        transition: border-color 0.2s, box-shadow 0.2s;
      }

      input:focus { 
        outline: none; 
        border-color: var(--primary); 
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); 
      }

      button { 
        background: var(--primary); 
        color: white; 
        border: none; 
        padding: 10px 18px; 
        cursor: pointer; 
        font-size: 14px; 
        font-weight: 600;
        border-radius: 6px; 
        transition: background 0.2s; 
      }

      button:hover { 
        background: var(--primary-hover); 
      }

      .btn-danger { 
        background: #ef4444; 
        padding: 6px 12px; 
        font-size: 12px; 
        margin-top: 8px; 
        width: auto; 
      }
      .btn-danger:hover { background: #dc2626; }

      .btn-success { 
        background: #10b981; 
        width: 100%; 
        padding: 12px;
        font-size: 16px; 
        margin-top: 25px; 
      }
      .btn-success:hover { background: #059669; }

      .btn-info {
        background: #0ea5e9;
        font-size: 13px;
        padding: 8px 14px;
      }
      .btn-info:hover { background: #0284c7; }

      .autocomplete-container { 
        position: relative; 
        margin-bottom: 5px; 
      }

      .suggestions-list { 
        position: absolute; 
        border: 1px solid var(--border-color); 
        z-index: 99; 
        top: 100%; 
        left: 0; 
        right: 0; 
        max-height: 180px; 
        overflow-y: auto; 
        background-color: #fff; 
        border-radius: 0 0 6px 6px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      }

      .suggestions-list div { 
        padding: 10px 12px; 
        cursor: pointer; 
        border-bottom: 1px solid #f3f4f6; 
        font-size: 13px; 
      }

      .suggestions-list div:hover { 
        background-color: #f8fafc; 
        color: var(--primary);
        font-weight: 500;
      }

      .loading-box { 
        text-align: center;
        font-style: italic; 
        color: var(--primary); 
        margin: 40px 0; 
        font-weight: 600; 
        font-size: 16px;
      }

      .item-row { 
        background: #f9fafb; 
        padding: 18px; 
        border: 1px solid #e5e7eb; 
        margin-bottom: 12px; 
        border-radius: 8px; 
      }

      hr { 
        margin: 25px 0; 
        border: 0; 
        border-top: 1px solid #e5e7eb; 
      }
    </style>
  </head>
  <body>
    
    <div class="container">
      <h3>Form Otomasi Dokumen Satpol PP</h3>
      
      <div id="loadingStatus" class="loading-box">⏳ Sedang memuat database, mohon tunggu sebentar...</div>

      <form id="docForm" onsubmit="handleFormSubmit(event)" style="display:none;">
        
        <label>Pilih Jenis Template Surat:</label>
        <div class="autocomplete-container">
          <input type="text" id="cari_template" placeholder="Ketik nama template (BAST / SPT)..." autocomplete="off" oninput="filterTemplate(this.value)">
          <div id="list_template" class="suggestions-list"></div>
        </div>
        <input type="hidden" id="template_id" name="template_id">
        <input type="hidden" id="jenis_surat" name="jenis_surat">

        <label>Nomor Surat:</label>
        <input type="text" name="nomor_surat" id="nomor_surat" placeholder="Masukkan Nomor Surat" autocomplete="off" required>
        
        <label>Tanggal Penugasan (Isi Surat / Hari & Tanggal):</label>
        <input type="text" name="hari_tanggal" id="hari_tanggal" placeholder="Contoh: 01 s/d 31 Agustus 2026" autocomplete="off" required>

        <!-- Bagian Tanggal Dikeluarkan (Di-hide otomatis jika memilih BAST) -->
        <div id="section_tanggal_dikeluarkan" style="display:none;">
          <label>Tanggal Dikeluarkan / Tanggal TTD Surat:</label>
          <input type="text" name="tanggal_dikeluarkan" id="tanggal_dikeluarkan" placeholder="Contoh: 31 Juli 2026" autocomplete="off">
        </div>
        
        <hr>

        <!-- Section Khusus BAST (Tabel Barang) -->
        <div id="section_barang" style="display:none;">
          <h4>Daftar Barang / Aset Diserahterimakan</h4>
          <div id="container-aset"></div>
          <button type="button" class="btn-info" onclick="tambahBarisAset()">+ Tambah Barang</button>
          <hr>
        </div>

        <!-- Section Khusus SPT (Tabel Personel) -->
        <div id="section_spt" style="display:none;">
          <h4>Daftar Anggota / Personel yang Ditugaskan</h4>
          <div id="container-personel"></div>
          <button type="button" class="btn-info" onclick="tambahBarisPersonel()">+ Tambah Anggota</button>
          <hr>
        </div>

        <!-- Section Pihak 1 & Pihak 2 -->
        <div id="section_pihak" style="display:none;">
          <h4>Pihak - Pihak Terkait</h4>
          
          <label>Cari Pihak 1 (Yang Menyerahkan):</label>
          <div class="autocomplete-container">
            <input type="text" id="cari_p1" placeholder="Ketik nama Pihak 1..." autocomplete="off" oninput="filterPegawai(this.value, 'p1')">
            <div id="list_p1" class="suggestions-list"></div>
          </div>
          <input type="text" name="nama_p1" id="nama_p1" placeholder="Nama Pihak 1">
          <input type="text" name="pangkat_p1" id="pangkat_p1" placeholder="Pangkat Pihak 1">
          <input type="text" name="nip_p1" id="nip_p1" placeholder="NIP Pihak 1">
          <input type="text" name="jabatan_p1" id="jabatan_p1" placeholder="Jabatan Pihak 1">

          <label style="margin-top: 15px;">Cari Pihak 2 (Yang Menerima):</label>
          <div class="autocomplete-container">
            <input type="text" id="cari_p2" placeholder="Ketik nama Pihak 2..." autocomplete="off" oninput="filterPegawai(this.value, 'p2')">
            <div id="list_p2" class="suggestions-list"></div>
          </div>
          <input type="text" name="nama_p2" id="nama_p2" placeholder="Nama Pihak 2">
          <input type="text" name="pangkat_p2" id="pangkat_p2" placeholder="Pangkat Pihak 2">
          <input type="text" name="nip_p2" id="nip_p2" placeholder="NIP Pihak 2">
          <input type="text" name="jabatan_p2" id="jabatan_p2" placeholder="Jabatan Pihak 2">
          
          <hr>
        </div>

        <!-- Pejabat Mengetahui / TTD -->
        <h4>Pejabat Penandatangan / Mengetahui</h4>
        <label>Cari Pejabat:</label>
        <div class="autocomplete-container">
          <input type="text" id="cari_mengetahui" placeholder="Ketik nama pejabat..." autocomplete="off" oninput="filterPegawai(this.value, 'mengetahui')">
          <div id="list_mengetahui" class="suggestions-list"></div>
        </div>
        <input type="text" name="nama_mengetahui" id="nama_mengetahui" placeholder="Nama Pejabat">
        <input type="text" name="pangkat_mengetahui" id="pangkat_mengetahui" placeholder="Pangkat / Golongan">
        <input type="text" name="nip_mengetahui" id="nip_mengetahui" placeholder="NIP Pejabat">
        
        <button type="submit" class="btn-success">Buat Dokumen Surat</button>
      </form>
    </div>

    <script>
      const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzcne152gfjpKSsQ1KykMwNwfXHsGBPiU0Z3Wz5sf2jrTa1g1ZZQVt3BwucVp7KoUf70w/exec';
      let rowIndex = 0;
      let personelIndex = 0;

      window.onload = function() {
        fetch(WEB_APP_URL + '?action=getData')
          .then(res => res.json())
          .then(res => {
            if(res.status === 'success') {
              window.dataPegawai = res.pegawai;
              window.dataAset = res.aset;
              window.dataTemplates = res.templates; 
              window.dataMasterPersonel = res.master_personel || [];

              document.getElementById('loadingStatus').style.display = 'none';
              document.getElementById('docForm').style.display = 'block';
              
              tambahBarisAset();
              tambahBarisPersonel();
            }
          })
          .catch(err => {
            document.getElementById('loadingStatus').innerText = 'Gagal memuat database: ' + err;
          });
      };

      document.addEventListener('click', function (e) {
        if (!e.target.closest('.autocomplete-container')) {
          document.querySelectorAll('.suggestions-list').forEach(el => el.innerHTML = '');
        }
      });

      function tambahBarisAset() {
        rowIndex++;
        let container = document.getElementById('container-aset');
        let div = document.createElement('div');
        div.className = 'item-row';
        div.id = 'row_aset_' + rowIndex;
        div.innerHTML = `
          <label>Cari Barang #${rowIndex}:</label>
          <div class="autocomplete-container">
            <input type="text" id="cari_aset_${rowIndex}" placeholder="Ketik nama barang/merk..." autocomplete="off" oninput="filterAset(this.value, ${rowIndex})">
            <div id="list_aset_${rowIndex}" class="suggestions-list"></div>
          </div>
          <input type="text" id="nama_barang_${rowIndex}" placeholder="Nama Barang">
          <input type="text" id="merk_type_${rowIndex}" placeholder="Merk/Type">
          <input type="text" id="no_seri_${rowIndex}" placeholder="No. Polisi / No. Seri">
          <input type="text" id="tahun_perolehan_${rowIndex}" placeholder="Tahun Perolehan">
          <input type="text" id="jumlah_${rowIndex}" placeholder="Jumlah" value="1">
          <input type="text" id="keterangan_${rowIndex}" placeholder="Keterangan">
          ${rowIndex > 1 ? '<button type="button" class="btn-danger" onclick="hapusBarisAset(' + rowIndex + ')">Hapus Barang</button>' : ''}
        `;
        container.appendChild(div);
      }

      function hapusBarisAset(id) {
        let row = document.getElementById('row_aset_' + id);
        if(row) row.remove();
      }

      function tambahBarisPersonel() {
        personelIndex++;
        let container = document.getElementById('container-personel');
        let div = document.createElement('div');
        div.className = 'item-row';
        div.id = 'row_pers_' + personelIndex;
        div.innerHTML = `
          <label>Cari Anggota #${personelIndex}:</label>
          <div class="autocomplete-container">
            <input type="text" id="cari_pers_${personelIndex}" placeholder="Ketik nama anggota..." autocomplete="off" oninput="filterMasterPersonel(this.value, ${personelIndex})">
            <div id="list_pers_${personelIndex}" class="suggestions-list"></div>
          </div>
          <input type="text" id="pers_nama_${personelIndex}" placeholder="Nama Lengkap">
          <input type="text" id="pers_pangkat_${personelIndex}" placeholder="Pangkat / Jabatan">
          ${personelIndex > 1 ? '<button type="button" class="btn-danger" onclick="hapusBarisPersonel(' + personelIndex + ')">Hapus Anggota</button>' : ''}
        `;
        container.appendChild(div);
      }

      function hapusBarisPersonel(id) {
        let row = document.getElementById('row_pers_' + id);
        if(row) row.remove();
      }

      function filterTemplate(val) {
        let list = document.getElementById('list_template');
        list.innerHTML = '';
        if (!val) return;
        
        let matches = window.dataTemplates.filter(t => t[0].toLowerCase().includes(val.toLowerCase()));
        matches.forEach(t => {
          let div = document.createElement('div');
          div.innerHTML = `<b>${t[0]}</b>`;
          div.onclick = function() {
            document.getElementById('cari_template').value = t[0];
            document.getElementById('jenis_surat').value = t[0];
            document.getElementById('template_id').value = t[1]; 
            
            if (t[2]) {
              document.getElementById('nomor_surat').value = t[2];
            }

            let namaSuratUpper = t[0].toUpperCase();
            
            let pakaiBarang = namaSuratUpper.includes('BAST') || namaSuratUpper.includes('SERAH');
            let pakaiSPT = namaSuratUpper.includes('TUGAS') || namaSuratUpper.includes('SPT');
            let pakaiPihak = namaSuratUpper.includes('BAST');

            // Tampilkan / Sembunyikan Section berdasarkan jenis surat
            document.getElementById('section_barang').style.display = pakaiBarang ? 'block' : 'none';
            document.getElementById('section_spt').style.display = pakaiSPT ? 'block' : 'none';
            document.getElementById('section_pihak').style.display = pakaiPihak ? 'block' : 'none';
            
            // Tanggal dikeluarkan HANYA muncul jika SPT, di-hide jika BAST/lainnya
            document.getElementById('section_tanggal_dikeluarkan').style.display = pakaiSPT ? 'block' : 'none';

            list.innerHTML = '';
          };
          list.appendChild(div);
        });
      }

      function filterMasterPersonel(val, index) {
        let list = document.getElementById('list_pers_' + index);
        list.innerHTML = '';
        if (!val) return;
        
        let matches = window.dataMasterPersonel.filter(p => p[0] && p[0].toLowerCase().includes(val.toLowerCase()));
        matches.forEach(p => {
          let div = document.createElement('div');
          div.innerHTML = `<b>${p[0]}</b> - ${p[1]}`;
          div.onclick = function() {
            document.getElementById('cari_pers_' + index).value = p[0];
            document.getElementById('pers_nama_' + index).value = p[0] || '';
            document.getElementById('pers_pangkat_' + index).value = p[1] || '';
            list.innerHTML = '';
          };
          list.appendChild(div);
        });
      }

      function filterPegawai(val, target) {
        let list = document.getElementById('list_' + target);
        list.innerHTML = '';
        if (!val) return;
        let matches = window.dataPegawai.filter(p => p[0].toLowerCase().includes(val.toLowerCase()) || p[1].toLowerCase().includes(val.toLowerCase()));
        matches.forEach(p => {
          let div = document.createElement('div');
          div.innerHTML = `<b>${p[0]}</b> (${p[1]})`;
          div.onclick = function() {
            document.getElementById('cari_' + target).value = p[0];
            if(target === 'p1') {
              document.getElementById('nama_p1').value = p[0] || '';
              document.getElementById('nip_p1').value = p[1] || '';
              document.getElementById('pangkat_p1').value = p[2] || '';
              document.getElementById('jabatan_p1').value = p[3] || '';
            } else if(target === 'p2') {
              document.getElementById('nama_p2').value = p[0] || '';
              document.getElementById('nip_p2').value = p[1] || '';
              document.getElementById('pangkat_p2').value = p[2] || '';
              document.getElementById('jabatan_p2').value = p[3] || '';
            } else if(target === 'mengetahui') {
              document.getElementById('nama_mengetahui').value = p[0] || '';
              document.getElementById('pangkat_mengetahui').value = p[2] || '';
              document.getElementById('nip_mengetahui').value = p[1] || '';
            }
            list.innerHTML = '';
          };
          list.appendChild(div);
        });
      }

      function filterAset(val, index) {
        let list = document.getElementById('list_aset_' + index);
        list.innerHTML = '';
        if (!val) return;
        
        let matches = window.dataAset.filter(a => 
          (a[0] && a[0].toLowerCase().includes(val.toLowerCase())) || 
          (a[1] && a[1].toLowerCase().includes(val.toLowerCase()))
        );

        matches.forEach(a => {
          let div = document.createElement('div');
          div.innerHTML = `<b>${a[0]}</b> - ${a[1]}`;
          div.onclick = function() {
            document.getElementById('cari_aset_' + index).value = a[0];
            document.getElementById('nama_barang_' + index).value = a[0] || '';
            document.getElementById('merk_type_' + index).value = a[1] || '';
            document.getElementById('no_seri_' + index).value = [a[2], a[3], a[4]].filter(Boolean).join(' | ');
            document.getElementById('tahun_perolehan_' + index).value = a[5] || '';
            list.innerHTML = '';
          };
          list.appendChild(div);
        });
      }

      async function handleFormSubmit(event) {
        event.preventDefault();
        
        if(!document.getElementById('template_id').value) {
          alert('Silakan pilih Template Surat terlebih dahulu dari autocomplete!');
          return;
        }

        alert('Sedang memproses dokumen, mohon tunggu...');
        
        const data = {
          template_id: document.getElementById('template_id').value,
          jenis_surat: document.getElementById('jenis_surat').value,
          nomor_surat: document.getElementById('nomor_surat').value,
          hari_tanggal: document.getElementById('hari_tanggal').value,
          tanggal_dikeluarkan: document.getElementById('tanggal_dikeluarkan').value,
          nama_p1: document.getElementById('nama_p1').value,
          pangkat_p1: document.getElementById('pangkat_p1').value,
          nip_p1: document.getElementById('nip_p1').value,
          jabatan_p1: document.getElementById('jabatan_p1').value,
          nama_p2: document.getElementById('nama_p2').value,
          pangkat_p2: document.getElementById('pangkat_p2').value,
          nip_p2: document.getElementById('nip_p2').value,
          jabatan_p2: document.getElementById('jabatan_p2').value,
          nama_mengetahui: document.getElementById('nama_mengetahui').value,
          pangkat_mengetahui: document.getElementById('pangkat_mengetahui').value,
          nip_mengetahui: document.getElementById('nip_mengetahui').value,
          items: [],
          personel_items: []
        };

        let sectionBarang = document.getElementById('section_barang');
        if (sectionBarang.style.display !== 'none') {
          let rows = document.querySelectorAll('#container-aset .item-row');
          rows.forEach(row => {
            let idMatch = row.id.split('_')[2];
            data.items.push({
              nama_barang: document.getElementById('nama_barang_' + idMatch).value,
              merk_type: document.getElementById('merk_type_' + idMatch).value,
              no_seri: document.getElementById('no_seri_' + idMatch).value,
              tahun_perolehan: document.getElementById('tahun_perolehan_' + idMatch).value,
              jumlah: document.getElementById('jumlah_' + idMatch).value,
              keterangan: document.getElementById('keterangan_' + idMatch).value
            });
          });
        }

        let sectionSpt = document.getElementById('section_spt');
        if (sectionSpt.style.display !== 'none') {
          let rowsPers = document.querySelectorAll('#container-personel .item-row');
          rowsPers.forEach(row => {
            let idMatch = row.id.split('_')[2];
            data.personel_items.push({
              nama: document.getElementById('pers_nama_' + idMatch).value,
              pangkat: document.getElementById('pers_pangkat_' + idMatch).value
            });
          });
        }

        try {
          const response = await fetch(WEB_APP_URL, {
            method: 'POST',
            body: JSON.stringify(data)
          });
          
          const result = await response.json();
          if(result.status === 'success') {
            alert('Berhasil! Link dokumen: ' + result.url);
            window.open(result.url, '_blank');
          } else {
            alert('Gagal: ' + result.message);
          }
        } catch (error) {
          alert('Terjadi kesalahan koneksi: ' + error);
        }
      }
    </script>
  </body>
</html>
