<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Otomasi Dokumen Satpol PP</title>
    <style>
      :root {
        --primary: #2563eb;
        --primary-hover: #1d4ed8;
        --bg-color: #f1f5f9;
        --card-bg: #ffffff;
        --text-color: #1e293b;
        --text-muted: #64748b;
        --border-color: #cbd5e1;
        --radius: 10px;
      }

      body { 
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
        background-color: var(--bg-color); 
        color: var(--text-color); 
        margin: 0; 
        padding: 20px; 
      }

      .container { 
        max-width: 800px; 
        margin: 20px auto; 
        background: var(--card-bg); 
        padding: 35px; 
        border-radius: var(--radius); 
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05); 
      }

      .header-title {
        display: flex;
        align-items: center;
        gap: 12px;
        border-bottom: 2px solid #f1f5f9;
        padding-bottom: 15px;
        margin-bottom: 25px;
      }

      .header-title h3 {
        margin: 0;
        color: #0f172a;
        font-size: 20px;
        font-weight: 700;
      }

      .header-title span {
        font-size: 13px;
        background: #e0f2fe;
        color: #0369a1;
        padding: 4px 10px;
        border-radius: 20px;
        font-weight: 600;
      }

      h4 { 
        color: #334155; 
        font-size: 15px; 
        margin: 25px 0 12px 0; 
        display: flex;
        align-items: center;
        gap: 8px;
        border-bottom: 1px dashed #e2e8f0;
        padding-bottom: 8px;
      }

      label { 
        font-size: 13px; 
        color: var(--text-muted); 
        font-weight: 600; 
        display: block; 
        margin-top: 14px; 
        margin-bottom: 6px; 
      }

      input, select { 
        width: 100%; 
        padding: 11px 14px; 
        border: 1px solid var(--border-color); 
        border-radius: 8px; 
        font-size: 14px; 
        box-sizing: border-box; 
        transition: all 0.2s ease;
        background-color: #f8fafc;
      }

      input:focus, select:focus { 
        outline: none; 
        border-color: var(--primary); 
        background-color: #ffffff;
        box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1); 
      }

      .row-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
      }

      button { 
        background: var(--primary); 
        color: white; 
        border: none; 
        padding: 10px 16px; 
        cursor: pointer; 
        font-size: 14px; 
        font-weight: 600;
        border-radius: 8px; 
        transition: background 0.2s, transform 0.1s; 
      }

      button:hover { 
        background: var(--primary-hover); 
      }

      button:active {
        transform: scale(0.98);
      }

      .btn-danger { 
        background: #fee2e2; 
        color: #dc2626;
        padding: 8px 14px; 
        font-size: 13px; 
        margin-top: 10px; 
        width: auto; 
        border-radius: 6px;
      }
      .btn-danger:hover { background: #fecaca; }

      .btn-success { 
        background: #10b981; 
        width: 100%; 
        padding: 14px;
        font-size: 15px; 
        margin-top: 30px; 
        box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
      }
      .btn-success:hover { background: #059669; }

      .btn-info {
        background: #f1f5f9;
        color: #475569;
        border: 1px solid #cbd5e1;
        font-size: 13px;
        padding: 8px 14px;
        margin-top: 10px;
      }
      .btn-info:hover { background: #e2e8f0; color: #1e293b; }

      .autocomplete-container { 
        position: relative; 
      }

      .suggestions-list { 
        position: absolute; 
        border: 1px solid var(--border-color); 
        z-index: 99; 
        top: 100%; 
        left: 0; 
        right: 0; 
        max-height: 200px; 
        overflow-y: auto; 
        background-color: #fff; 
        border-radius: 0 0 8px 8px;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      }

      .suggestions-list div { 
        padding: 11px 14px; 
        cursor: pointer; 
        border-bottom: 1px solid #f1f5f9; 
        font-size: 13px; 
      }

      .suggestions-list div:hover { 
        background-color: #f8fafc; 
        color: var(--primary);
        font-weight: 500;
      }

      .loading-box { 
        text-align: center;
        color: var(--primary); 
        margin: 50px 0; 
        font-weight: 600; 
        font-size: 15px;
      }

      .item-row { 
        background: #f8fafc; 
        padding: 20px; 
        border: 1px solid #e2e8f0; 
        margin-bottom: 15px; 
        border-radius: 8px; 
      }

      .section-card {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        padding: 20px;
        border-radius: 8px;
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    
    <div class="container">
      <div class="header-title">
        <h3>Otomasi Dokumen Surat</h3>
        <span>Satpol PP Kota Serang</span>
      </div>
      
      <div id="loadingStatus" class="loading-box">⏳ Memuat database sistem, mohon tunggu sebentar...</div>

      <form id="docForm" onsubmit="handleFormSubmit(event)" style="display:none;">
        
        <label>Pilih Jenis Template Surat:</label>
        <div class="autocomplete-container">
          <input type="text" id="cari_template" placeholder="🔍 Ketik nama template (BAST / SPT)..." autocomplete="off" oninput="filterTemplate(this.value)">
          <div id="list_template" class="suggestions-list"></div>
        </div>
        <input type="hidden" id="template_id" name="template_id">
        <input type="hidden" id="jenis_surat" name="jenis_surat">

        <div id="form_content" style="display:none;">
          
          <div class="row-grid">
            <div id="container-no-surat"> <!-- Ditambahkan ID untuk disembunyikan/dimunculkan -->
              <label>Nomor Surat:</label>
              <input type="text" name="nomor_surat" id="nomor_surat" placeholder="Contoh: 300.1.2.2/..." autocomplete="off">
            </div>
            <div>
              <label>Tanggal Penugasan / Kegiatan:</label>
              <input type="text" name="hari_tanggal" id="hari_tanggal" placeholder="Contoh: 01 s/d 31 Agustus 2026" autocomplete="off">
            </div>
          </div>

          <div id="section_tanggal_dikeluarkan" style="display:none;">
            <label>Tanggal Dikeluarkan Surat (TTD):</label>
            <input type="text" name="tanggal_dikeluarkan" id="tanggal_dikeluarkan" placeholder="Contoh: 31 Juli 2026" autocomplete="off">
          </div>
          
          <!-- Section Khusus BAST (Tabel Barang) -->
          <div id="section_barang" class="section-card" style="display:none;">
            <h4>📦 Daftar Barang / Aset Diserahterimakan</h4>
            <div id="container-aset"></div>
            <button type="button" class="btn-info" onclick="tambahBarisAset()">+ Tambah Baris Barang</button>
          </div>

          <!-- Section Khusus SPT (Pengaturan Personel: Ganti atau Hapus) -->
          <div id="section_spt" class="section-card" style="display:none;">
            <h4>👥 Pengaturan Personel (Ganti / Hapus)</h4>
            <div id="container-modify"></div>
            <button type="button" class="btn-info" onclick="tambahBarisModify()">+ Tambah Aksi Personel</button>
          </div>

          <!-- Section Pihak 1 & Pihak 2 -->
          <div id="section_pihak" class="section-card" style="display:none;">
            <h4>🤝 Pihak - Pihak Terkait</h4>
            
            <label>Cari Pihak 1 (Yang Menyerahkan):</label>
            <div class="autocomplete-container">
              <input type="text" id="cari_p1" placeholder="🔍 Ketik nama Pihak 1..." autocomplete="off" oninput="filterPegawai(this.value, 'p1')">
              <div id="list_p1" class="suggestions-list"></div>
            </div>
            <div class="row-grid" style="margin-top: 8px;">
              <input type="text" name="nama_p1" id="nama_p1" placeholder="Nama Pihak 1">
              <input type="text" name="pangkat_p1" id="pangkat_p1" placeholder="Pangkat Pihak 1">
            </div>
            <div class="row-grid" style="margin-top: 8px;">
              <input type="text" name="nip_p1" id="nip_p1" placeholder="NIP Pihak 1">
              <input type="text" name="jabatan_p1" id="jabatan_p1" placeholder="Jabatan Pihak 1">
            </div>

            <label style="margin-top: 15px;">Cari Pihak 2 (Yang Menerima):</label>
            <div class="autocomplete-container">
              <input type="text" id="cari_p2" placeholder="🔍 Ketik nama Pihak 2..." autocomplete="off" oninput="filterPegawai(this.value, 'p2')">
              <div id="list_p2" class="suggestions-list"></div>
            </div>
            <div class="row-grid" style="margin-top: 8px;">
              <input type="text" name="nama_p2" id="nama_p2" placeholder="Nama Pihak 2">
              <input type="text" name="pangkat_p2" id="pangkat_p2" placeholder="Pangkat Pihak 2">
            </div>
            <div class="row-grid" style="margin-top: 8px;">
              <input type="text" name="nip_p2" id="nip_p2" placeholder="NIP Pihak 2">
              <input type="text" name="jabatan_p2" id="jabatan_p2" placeholder="Jabatan Pihak 2">
            </div>
          </div>

          <!-- Section Pejabat Penandatangan -->
          <div id="section_mengetahui" class="section-card" style="display:none;">
            <h4>✍️ Pejabat Penandatangan / Mengetahui</h4>
            <label>Cari Pejabat:</label>
            <div class="autocomplete-container">
              <input type="text" id="cari_mengetahui" placeholder="🔍 Ketik nama pejabat..." autocomplete="off" oninput="filterPegawai(this.value, 'mengetahui')">
              <div id="list_mengetahui" class="suggestions-list"></div>
            </div>
            <div class="row-grid" style="margin-top: 8px;">
              <input type="text" name="nama_mengetahui" id="nama_mengetahui" placeholder="Nama Pejabat">
              <input type="text" name="pangkat_mengetahui" id="pangkat_mengetahui" placeholder="Pangkat / Golongan">
            </div>
            <input type="text" name="nip_mengetahui" id="nip_mengetahui" placeholder="NIP Pejabat" style="margin-top: 8px;">
          </div>
          
          <button type="submit" class="btn-success">🚀 Buat Dokumen Surat Sekarang</button>
        </div>

      </form>
    </div>

    <script>
      const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzcne152gfjpKSsQ1KykMwNwfXHsGBPiU0Z3Wz5sf2jrTa1g1ZZQVt3BwucVp7KoUf70w/exec';
      let rowIndex = 0;
      let modifyIndex = 0;

      window.onload = function() {
        fetch(WEB_APP_URL + '?action=getData')
          .then(res => res.json())
          .then(res => {
            if(res.status === 'success') {
              window.dataPegawai = res.pegawai;
              window.dataAset = res.aset;
              window.dataTemplates = res.templates; 
              window.dataMasterPersonel = res.master_personel || [];

              document.getElementById('loadingStatus').style.display = 'none';
              document.getElementById('docForm').style.display = 'block';
              
              tambahBarisAset();
              tambahBarisModify();
            }
          })
          .catch(err => {
            document.getElementById('loadingStatus').innerText = 'Gagal memuat database: ' + err;
          });
      };

      document.addEventListener('click', function (e) {
        if (!e.target.closest('.autocomplete-container')) {
          document.querySelectorAll('.suggestions-list').forEach(el => el.innerHTML = '');
        }
      });

      function tambahBarisModify() {
        modifyIndex++;
        let container = document.getElementById('container-modify');
        let div = document.createElement('div');
        div.className = 'item-row';
        div.id = 'row_mod_' + modifyIndex;
        div.innerHTML = `
          <div class="row-grid">
            <div>
              <label>Pilih Aksi #${modifyIndex}:</label>
              <select id="aksi_${modifyIndex}" onchange="toggleAksiField(${modifyIndex})">
                <option value="ganti">Ganti Nama di Tabel</option>
                <option value="hapus">Hapus Nama dari Tabel</option>
              </select>
            </div>
            <div>
              <label>Cari Personel Asli yang Disasar:</label>
              <div class="autocomplete-container">
                <input type="text" id="cari_target_${modifyIndex}" placeholder="🔍 Ketik nama asli..." autocomplete="off" oninput="filterTargetModify(this.value, ${modifyIndex})">
                <div id="list_target_${modifyIndex}" class="suggestions-list"></div>
              </div>
              <input type="hidden" id="target_nama_${modifyIndex}">
            </div>
          </div>

          <div id="wrap_pengganti_${modifyIndex}" style="margin-top: 10px;">
            <label>Cari Anggota Pengganti:</label>
            <div class="autocomplete-container">
              <input type="text" id="cari_mod_${modifyIndex}" placeholder="🔍 Ketik nama anggota pengganti..." autocomplete="off" oninput="filterMasterModify(this.value, ${modifyIndex})">
              <div id="list_mod_${modifyIndex}" class="suggestions-list"></div>
            </div>
            <div class="row-grid" style="margin-top: 8px;">
              <input type="text" id="mod_nama_${modifyIndex}" placeholder="Nama Lengkap Baru">
              <input type="text" id="mod_pangkat_${modifyIndex}" placeholder="Pangkat / Jabatan Baru">
            </div>
          </div>

          ${modifyIndex > 1 ? '<button type="button" class="btn-danger" onclick="hapusBarisModify(' + modifyIndex + ')">Hapus Aksi Ini</button>' : ''}
        `;
        container.appendChild(div);
      }

      function toggleAksiField(id) {
        let aksi = document.getElementById('aksi_' + id).value;
        let wrap = document.getElementById('wrap_pengganti_' + id);
        wrap.style.display = (aksi === 'hapus') ? 'none' : 'block';
      }

      function hapusBarisModify(id) {
        let row = document.getElementById('row_mod_' + id);
        if(row) row.remove();
      }

      function filterTargetModify(val, index) {
        let list = document.getElementById('list_target_' + index);
        list.innerHTML = '';
        if (!val) return;
        
        let matches = window.dataMasterPersonel.filter(p => p[0] && p[0].toLowerCase().includes(val.toLowerCase()));
        matches.forEach(p => {
          let div = document.createElement('div');
          div.innerHTML = `<b>${p[0]}</b> - ${p[1]}`;
          div.onclick = function() {
            document.getElementById('cari_target_' + index).value = p[0];
            document.getElementById('target_nama_' + index).value = p[0];
            list.innerHTML = '';
          };
          list.appendChild(div);
        });
      }

      function tambahBarisAset() {
        rowIndex++;
        let container = document.getElementById('container-aset');
        let div = document.createElement('div');
        div.className = 'item-row';
        div.id = 'row_aset_' + rowIndex;
        div.innerHTML = `
          <label>Cari Barang / Aset #${rowIndex}:</label>
          <div class="autocomplete-container">
            <input type="text" id="cari_aset_${rowIndex}" placeholder="🔍 Ketik nama barang/merk..." autocomplete="off" oninput="filterAset(this.value, ${rowIndex})">
            <div id="list_aset_${rowIndex}" class="suggestions-list"></div>
          </div>
          <div class="row-grid" style="margin-top: 8px;">
            <input type="text" id="nama_barang_${rowIndex}" placeholder="Nama Barang">
            <input type="text" id="merk_type_${rowIndex}" placeholder="Merk/Type">
          </div>
          <div class="row-grid" style="margin-top: 8px;">
            <input type="text" id="no_seri_${rowIndex}" placeholder="No. Polisi / No. Seri">
            <input type="text" id="tahun_perolehan_${rowIndex}" placeholder="Tahun Perolehan">
          </div>
          <div class="row-grid" style="margin-top: 8px;">
            <input type="text" id="jumlah_${rowIndex}" placeholder="Jumlah" value="1">
            <input type="text" id="keterangan_${rowIndex}" placeholder="Keterangan">
          </div>
          ${rowIndex > 1 ? '<button type="button" class="btn-danger" onclick="hapusBarisAset(' + rowIndex + ')">Hapus Barang Ini</button>' : ''}
        `;
        container.appendChild(div);
      }

      function hapusBarisAset(id) {
        let row = document.getElementById('row_aset_' + id);
        if(row) row.remove();
      }

      function filterTemplate(val) {
        let list = document.getElementById('list_template');
        list.innerHTML = '';
        if (!val) {
          document.getElementById('form_content').style.display = 'none';
          return;
        }
        
        let matches = window.dataTemplates.filter(t => t[0].toLowerCase().includes(val.toLowerCase()));
        matches.forEach(t => {
          let div = document.createElement('div');
          div.innerHTML = `<b>${t[0]}</b>`;
          div.onclick = function() {
            document.getElementById('cari_template').value = t[0];
            document.getElementById('jenis_surat').value = t[0];
            document.getElementById('template_id').value = t[1]; 
            
            if (t[2]) {
              document.getElementById('nomor_surat').value = t[2];
            }

            document.getElementById('form_content').style.display = 'block';

            let namaSuratUpper = t[0].toUpperCase();
            
            // 1. Reset semua bagian form (Sembunyikan)
            document.getElementById('container-no-surat').style.display = 'none';
            document.getElementById('section_tanggal_dikeluarkan').style.display = 'none';
            document.getElementById('section_barang').style.display = 'none';
            document.getElementById('section_spt').style.display = 'none';
            document.getElementById('section_pihak').style.display = 'none';
            document.getElementById('section_mengetahui').style.display = 'none';

            // 2. Tampilkan bagian form sesuai jenis template
            if (namaSuratUpper.includes('BAST') || namaSuratUpper.includes('SERAH')) {
                document.getElementById('container-no-surat').style.display = 'block';
                document.getElementById('section_barang').style.display = 'block';
                document.getElementById('section_pihak').style.display = 'block';
                document.getElementById('section_mengetahui').style.display = 'block';
            } 
            else if (namaSuratUpper.includes('JADWAL')) {
                document.getElementById('section_tanggal_dikeluarkan').style.display = 'block'; 
                document.getElementById('section_spt').style.display = 'block';
                document.getElementById('section_mengetahui').style.display = 'block';
            } 
            else if (namaSuratUpper.includes('LAMPIRAN')) {
                document.getElementById('container-no-surat').style.display = 'block';
                document.getElementById('section_tanggal_dikeluarkan').style.display = 'block';
                document.getElementById('section_spt').style.display = 'block';
            } 
            else if (namaSuratUpper.includes('TUGAS') || namaSuratUpper.includes('SPT')) {
                document.getElementById('container-no-surat').style.display = 'block';
                document.getElementById('section_tanggal_dikeluarkan').style.display = 'block';
                document.getElementById('section_spt').style.display = 'block';
                document.getElementById('section_mengetahui').style.display = 'block';
            }

            list.innerHTML = '';
          };
          list.appendChild(div);
        });
      }

      function filterMasterModify(val, index) {
        let list = document.getElementById('list_mod_' + index);
        list.innerHTML = '';
        if (!val) return;
        
        let matches = window.dataMasterPersonel.filter(p => p[0] && p[0].toLowerCase().includes(val.toLowerCase()));
        matches.forEach(p => {
          let div = document.createElement('div');
          div.innerHTML = `<b>${p[0]}</b> - ${p[1]}`;
          div.onclick = function() {
            document.getElementById('cari_mod_' + index).value = p[0];
            document.getElementById('mod_nama_' + index).value = p[0] || '';
            document.getElementById('mod_pangkat_' + index).value = p[1] || '';
            list.innerHTML = '';
          };
          list.appendChild(div);
        });
      }

      function filterPegawai(val, target) {
        let list = document.getElementById('list_' + target);
        list.innerHTML = '';
        if (!val) return;
        let matches = window.dataPegawai.filter(p => p[0].toLowerCase().includes(val.toLowerCase()) || p[1].toLowerCase().includes(val.toLowerCase()));
        matches.forEach(p => {
          let div = document.createElement('div');
          div.innerHTML = `<b>${p[0]}</b> (${p[1]})`;
          div.onclick = function() {
            document.getElementById('cari_' + target).value = p[0];
            if(target === 'p1') {
              document.getElementById('nama_p1').value = p[0] || '';
              document.getElementById('nip_p1').value = p[1] || '';
              document.getElementById('pangkat_p1').value = p[2] || '';
              document.getElementById('jabatan_p1').value = p[3] || '';
            } else if(target === 'p2') {
              document.getElementById('nama_p2').value = p[0] || '';
              document.getElementById('nip_p2').value = p[1] || '';
              document.getElementById('pangkat_p2').value = p[2] || '';
              document.getElementById('jabatan_p2').value = p[3] || '';
            } else if(target === 'mengetahui') {
              document.getElementById('nama_mengetahui').value = p[0] || '';
              document.getElementById('pangkat_mengetahui').value = p[2] || '';
              document.getElementById('nip_mengetahui').value = p[1] || '';
            }
            list.innerHTML = '';
          };
          list.appendChild(div);
        });
      }

      async function handleFormSubmit(event) {
        event.preventDefault();
        
        if(!document.getElementById('template_id').value) {
          alert('Silakan pilih Template Surat terlebih dahulu dari autocomplete!');
          return;
        }

        alert('Sedang memproses dokumen, mohon tunggu...');
        
        const data = {
          template_id: document.getElementById('template_id').value,
          jenis_surat: document.getElementById('jenis_surat').value,
          nomor_surat: document.getElementById('nomor_surat').value,
          hari_tanggal: document.getElementById('hari_tanggal').value,
          tanggal_dikeluarkan: document.getElementById('tanggal_dikeluarkan').value,
          nama_p1: document.getElementById('nama_p1').value,
          pangkat_p1: document.getElementById('pangkat_p1').value,
          nip_p1: document.getElementById('nip_p1').value,
          jabatan_p1: document.getElementById('jabatan_p1').value,
          nama_p2: document.getElementById('nama_p2').value,
          pangkat_p2: document.getElementById('pangkat_p2').value,
          nip_p2: document.getElementById('nip_p2').value,
          jabatan_p2: document.getElementById('jabatan_p2').value,
          nama_mengetahui: document.getElementById('nama_mengetahui').value,
          pangkat_mengetahui: document.getElementById('pangkat_mengetahui').value,
          nip_mengetahui: document.getElementById('nip_mengetahui').value,
          items: [],
          personel_items: []
        };

        let sectionBarang = document.getElementById('section_barang');
        if (sectionBarang.style.display !== 'none') {
          let rows = document.querySelectorAll('#container-aset .item-row');
          rows.forEach(row => {
            let idMatch = row.id.split('_')[2];
            data.items.push({
              nama_barang: document.getElementById('nama_barang_' + idMatch).value,
              merk_type: document.getElementById('merk_type_' + idMatch).value,
              no_seri: document.getElementById('no_seri_' + idMatch).value,
              tahun_perolehan: document.getElementById('tahun_perolehan_' + idMatch).value,
              jumlah: document.getElementById('jumlah_' + idMatch).value,
              keterangan: document.getElementById('keterangan_' + idMatch).value
            });
          });
        }

        let sectionSpt = document.getElementById('section_spt');
        if (sectionSpt.style.display !== 'none') {
          let rowsMod = document.querySelectorAll('#container-modify .item-row');
          rowsMod.forEach(row => {
            let idMatch = row.id.split('_')[2];
            data.personel_items.push({
              aksi: document.getElementById('aksi_' + idMatch).value,
              target_nama: document.getElementById('target_nama_' + idMatch).value,
              nama: document.getElementById('mod_nama_' + idMatch).value,
              pangkat: document.getElementById('mod_pangkat_' + idMatch).value
            });
          });
        }

        try {
          const response = await fetch(WEB_APP_URL, {
            method: 'POST',
            body: JSON.stringify(data)
          });
          
          const result = await response.json();
          if(result.status === 'success') {
            alert('Berhasil! Link dokumen: ' + result.url);
            window.open(result.url, '_blank');
          } else {
            alert('Gagal: ' + result.message);
          }
        } catch (error) {
          alert('Terjadi kesalahan koneksi: ' + error);
        }
      }
    </script>
  </body>
</html>
